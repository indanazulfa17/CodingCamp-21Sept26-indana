<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Expense & Budget Visualizer</h1>
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Switch to dark mode" aria-checked="false">
          <span class="theme-icon">☀️</span>
          <span class="theme-icon">🌙</span>
          <span class="toggle-thumb"></span>
        </button>
      </div>
    </header>
      <section id="summary-section">
  <div class="total-card">
    <span class="summary-label">Total Spending</span>
    <strong id="balance-display">$0.00</strong>
    <span class="summary-description">Your current spending</span>
  </div>

  <div class="limit-card">
    <span class="summary-label">Spending Limit</span>
    <input
      type="number"
      id="spending-limit"
      min="0"
      step="0.01"
      placeholder="No limit set"
      aria-label="Spending limit amount"
    />
  </div>
</section>
    <main>
      <section id="form-section">
        <form id="input-form" novalidate>
          <div class="form-field">
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" name="name" maxlength="100" autocomplete="off" placeholder="e.g. Coffee" />
            <span class="field-error" id="name-error" aria-live="polite"></span>
          </div>
          <div class="form-field">
            <label for="item-amount">Amount</label>
            <input type="number" id="item-amount" name="amount" step="0.01" min="0.01" max="999999999.99" placeholder="0.00" />
            <span class="field-error" id="amount-error" aria-live="polite"></span>
          </div>
          <div class="form-field">
            <label for="item-category">Category</label>
            <select id="item-category" name="category">
              <option value="">-- Select --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="field-error" id="category-error" aria-live="polite"></span>
          </div>
          <button type="submit">Add Transaction</button>
        </form>
      
      </section>

      <section id="chart-section">
        <canvas id="spending-chart"></canvas>
        <p id="chart-placeholder" hidden>No data available</p>
      </section>

      <section id="list-section">
        <div class="list-controls">
          <label for="sort-select">Sort by</label>
          <select id="sort-select" aria-label="Sort transactions">
            <option value="newest">Newest first</option>
            <option value="amount-desc">Amount (high to low)</option>
            <option value="amount-asc">Amount (low to high)</option>
            <option value="category">Category (A to Z)</option>
          </select>
        </div>
        <ul id="transaction-list"></ul>
        <p id="list-placeholder" hidden>No transactions yet</p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
